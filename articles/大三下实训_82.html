<script>
// Theme toggle - light/dark
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const prismTheme = document.getElementById('prism-theme');
  if (theme === 'dark') {
    prismTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css';
  } else {
    prismTheme.href = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css';
  }
  localStorage.setItem('blog-theme', theme);
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  applyTheme(next);
}
// Initialize from localStorage
document.addEventListener('DOMContentLoaded', function() {
  const saved = localStorage.getItem('blog-theme');
  if (saved) {
    applyTheme(saved);
  } else {
    applyTheme('dark');
  }
});
</script>

<script>
// 一键复制代码
function copyCode(btn) {{
  var block = btn.closest('.code-block') || btn.closest('.inline-code-block');
  var code = block.querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(function() {{
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(function() {{ btn.textContent = 'Copy'; btn.classList.remove('copied'); }}, 2000);
  }}).catch(function() {{
    // fallback
    var ta = document.createElement('textarea');
    ta.value = code;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(function() {{ btn.textContent = 'Copy'; btn.classList.remove('copied'); }}, 2000);
  }});
}}

// 自动包装连续的代码段落为整体代码块并添加复制按钮
document.addEventListener('DOMContentLoaded', function() {{
  var all = document.querySelectorAll('.article-body > p[data-code="true"]');
  if (!all.length) return;
  // 分组连续段落
  var groups = [];
  var cur = [];
  all.forEach(function(p) {{
    if (cur.length === 0 || p.previousElementSibling === cur[cur.length - 1]) {{
      cur.push(p);
    }} else {{
      groups.push(cur);
      cur = [p];
    }}
  }});
  if (cur.length) groups.push(cur);
  // 每组包装为一个代码块
  groups.forEach(function(grp) {{
    var codes = grp.map(function(p) {{ return p.innerHTML.trim(); }}).join('
');
    if (!codes) return;
    var wrapper = document.createElement('div');
    wrapper.className = 'inline-code-block';
    wrapper.innerHTML = '<div class="code-header"><span class="code-lang">Code</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>' + codes + '</code></pre></div>';
    grp[0].parentNode.insertBefore(wrapper, grp[0]);
    grp.forEach(function(p) {{ p.parentNode.removeChild(p); }});
  }});
  if (typeof Prism !== 'undefined') {{
    Prism.highlightAll();
  }}
}});
</script>
